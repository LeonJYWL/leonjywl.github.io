n><footer><span class="micro">U16L ／ Leon</span><a href="#top">回到封面 ↑</a></footer><dialog id="reader"><div class="row"><span class="micro">U16L ／ 阅读室</span><button aria-label="关闭阅读室" onclick="reader.close()">×</button></div><div id="page"></div></dialog><script>const theme=2,entries=[["研究", "Balance sheets", "四家房企的财务故事", "2013—2015 年的财务资料，是重新理解四家房地产企业的入口。", "阅读路径", "先读报告，再对照原始数据。相同年份的并列比较，可以把规模差异和变化趋势分开看。", "https://u16l.com/real-estate-report.pdf", "阅读完整报告 PDF"], ["实验", "Pelican test", "让鹈鹕骑上自行车", "给两个模型同一条指令，观察它们怎样把一句话变成会动的图形。", "一条共同的指令", "“创建一个 HTML，内容是 SVG 绘制一个鹈鹕骑自行车的 2D 动画。” 原实验并列展示 GPT-6.2 Astra 与 Gemini 4 Argon 的实现。", "https://u16l.com/experiments/pelican/", "观看原实验"], ["习作", "Form studies", "形态发生器", "本轮原型内的程序习作。改变一个参数，观察同一组线如何长成不同形态。", "动手试一次", "回到封面，切换第三个入口，再与第一个入口比较。线条的密度、方向与重叠方式共同决定轮廓。", "", ""]];</script><script>const cv=document.querySelector("canvas"),ctx=cv.getContext("2d");
let choice=0,frame=0,tween=1;
const motion=matchMedia("(prefers-reduced-motion: reduce)");
function readItem(i){
 const e=entries[i];
 page.innerHTML='<p class="micro">'+e[0]+' ／ '+e[1]+'</p><h2>'+e[2]+'</h2><p>'+e[3]+'</p><h3>'+e[4]+'</h3><p>'+e[5]+'</p>'+(e[6]?'<a href="'+e[6]+'">'+e[7]+' ↗</a>':'')+(i===0?'<br><a href="https://u16l.com/四家房企财务数据.xlsx">对照财务数据 XLSX ↗</a>':'');
 reader.showModal()
}
function about(){page.innerHTML='<h2>关于 Leon</h2><p>U16L 是 Leon 的个人数字空间，收录金融与商业研究、AI 实验及数字创作。投资笔记、三维作品和互动工具也可以在这里继续生长。</p>';reader.showModal()}
reader.addEventListener('click',e=>{if(e.target===reader){const r=reader.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)reader.close()}});
function select(i,animate=true){choice=i;current.textContent=entries[i][2];tag.textContent=(theme===2?'FOLD 0'+(i+1)+' / 03 · ':'')+entries[i][1];document.querySelectorAll('.selector').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.i===i));cancelAnimationFrame(frame);const start=performance.now();function tick(t){tween=motion.matches||!animate?1:Math.min(1,(t-start)/540);render();if(tween<1)frame=requestAnimationFrame(tick)}tick(start)}
document.querySelectorAll('.selector').forEach(b=>b.onclick=()=>select(+b.dataset.i));
const TAU=Math.PI*2,S=Math.sin,C=Math.cos;
function line(points,color,width=.9,fill=false){ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));if(fill){ctx.closePath();ctx.fillStyle=color;ctx.fill()}else{ctx.lineWidth=width;ctx.strokeStyle=color;ctx.stroke()}}
function render(){
 const r=cv.getBoundingClientRect();if(!r.width||!r.height)return;
 const d=Math.min(1.6,devicePixelRatio);if(cv.width!==Math.round(r.width*d)||cv.height!==Math.round(r.height*d)){cv.width=Math.round(r.width*d);cv.height=Math.round(r.height*d)}
 ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);
 const scale=Math.min(cv.width/660,cv.height/470);ctx.translate(cv.width/2,cv.height/2);ctx.scale(scale,scale);ctx.globalAlpha=.65+.35*tween;
 if(theme===0)ocean();else if(theme===1)garden();else fold()
}
function ocean(){
 function medusa(x,y,size,angle){
 ctx.save();ctx.translate(x,y);ctx.rotate(angle+.07*(1-tween));ctx.scale(size,size);
 // Each latitude is a closed, rippling filament; projection flattens the rear arc.
 for(let j=0;j<77;j++){
 const a=.015+j/77*1.69,pts=[];
 for(let i=0;i<=148;i++){const p=i/148*TAU,flute=1+.055*S((11+choice*2)*p+1.6*a)*S(a)**2;pts.push([155*S(a)*C(p)*flute,-113*C(a)+35*S(a)*S(p)+8*S(11*p)*S(a)**4])}
 line(pts,'rgba(0,71,215,'+(.12+.35*j/77)+')',.95)
 }
 for(let j=0;j<72;j++){
 const p=j/72*TAU,pts=[],L=107+74*(.5+.5*S(j*1.43))+choice*12;
 for(let m=0;m<=60;m++){let t=m/60;pts.push([147*C(p)*(1-.68*t)+t*(18*S(t*9+p*2)+43*S(4*t+p))+12*S(19*t+p)*t,14+34*S(p)+t*L+5*S(8*t+p)])}
 line(pts,j%6===0?'#005de2':'rgba(26,113,217,.38)',j%6===0?1.5:.8)
 }ctx.restore()}
 medusa(-196,-86,.42,-.45);medusa(60,-16,1.22,.28+.12*choice);medusa(-155,121,.33,-.26);
}
function garden(){
 // Curved rachis with paired, veined lanceolate leaves.
 function frond(x,y,len,a,n,tint){
 ctx.save();ctx.translate(x,y);ctx.rotate(a);let stem=[];
 for(let j=0;j<=80;j++){let t=j/80;stem.push([39*t*t,-len*t])}line(stem,'#4b5135',2.3);
 for(let j=1;j<=n;j++){let t=j/(n+1),l=(.22+.78*S(Math.PI*t)**.72)*len*(.23+.03*choice),x=39*t*t,y=-len*t;
 for(const sign of [-1,1]){ctx.save();ctx.translate(x,y);ctx.scale(sign,1);ctx.rotate(-.24-t*.38);let top=[],bot=[];
 for(let m=0;m<=36;m++){let u=m/36,w=l*.15*S(Math.PI*u)**.7;top.push([u*l,-u*u*l*.4-w]);bot.push([u*l,-u*u*l*.4+w])}
 line([...top,...bot.reverse()],tint,true,true);
 for(let m=1;m<16;m++){let u=m/18;line([[l*u,-u*u*l*.4],[l*(u+.095),-u*u*l*.4-l*.12*S(Math.PI*u)]],'#d9dbb1',.65)}
 ctx.restore()}}
 ctx.restore()}
 for(let j=0;j<6;j++){let ang=[-1.08,-.72,-.34,.08,.45,.86][j];frond(-12,185,235+100*S(j*.73)+choice*9,ang+.08*choice+.09*(1-tween),13+(choice+j)%4,['#687552','#505f40','#6b7850'][j%3])}
}
function fold(){
 // Alternating front and back facets share their printed baseline.
 const flat=Number(crease.value)/100,cols=9,ww=(450+100*flat)/cols;
 ctx.save();ctx.rotate(-.17+.07*choice+.05*(1-tween));
 for(let j=0;j<cols;j++){let x=-ww*cols/2+ww*j,v=j%2,top=-99+(v?37:-8)+22*S(j*.7+choice),next=-99+(v?-8:37)+22*S((j+1)*.7+choice),dep=203;top=(top+99)*(1-flat)-99;next=(next+99)*(1-flat)-99;
 ctx.save();ctx.transform(1,(next-top)/ww,0,1,x,top);
 ctx.fillStyle=v?['#dbb99b','#b4a6b9','#adb992'][choice]:['#fff0cf','#eadcf5','#dbefba'][choice];ctx.fillRect(0,0,ww+1,dep);
 ctx.beginPath();ctx.rect(0,0,ww+1,dep);ctx.clip();
 ctx.fillStyle=v?'#9c3020':'#e44428';ctx.font='900 163px Arial';ctx.save();ctx.scale(1.24,1);ctx.fillText(['U16L','TYPE','FORM'][choice],(-j*ww+8)/1.24,158);ctx.restore();
 for(let q=0;q<11;q++){ctx.fillStyle=q%3===0?'#20211d':'#87594a';ctx.fillRect(0,173+q*1.6,ww+1,.55)}
 ctx.fillStyle='#352e22';ctx.font='bold 10px monospace';ctx.fillText('U16L  /  EDITION     '+entries[choice][1].toUpperCase(),6-j*ww,18);
 ctx.restore()}ctx.restore()
}
new ResizeObserver(render).observe(cv);select(0,false);
