<!doctype html>
<html lang="zh-CN"
  ><head>
    <meta charset="utf-8" /><meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#f6f4eb" /><title>制作邀请 · Date Invitation</title>
    <link rel="icon" href="./assets/post.svg" /><link rel="stylesheet" href="./style.css" /><script
      type="module"
      src="./js/create.js"
    ></script> </head
  ><body
    ><div class="shell"
      ><header class="mast"
        ><div class="brand"
          ><img src="./assets/post.svg" alt="" width="36" height="36" /><span
            >Date Invitation<span class="brand-dot">.</span></span
          ></div
        ><span class="version"><i></i> V1.0</span></header
      >
      <main class="creator sheet"
        ><div class="eyebrow"><i></i> DATE POST <span>/</span> 生成器</div
        ><h1>制作邀请<span class="period">。</span></h1>
        <form id="form"
          ><label for="recipient">受邀人昵称</label
          ><input id="recipient" autocomplete="off" placeholder="留空生成通用邀请" maxlength="48" />
          <details
            ><summary>高级设置</summary
            ><div class="advanced">
              <label for="sender">邀请人昵称</label><input id="sender" maxlength="48" />
              <label for="copy">邀请正文 <small>最多 180 字</small></label
              ><textarea id="copy" rows="4" maxlength="360"></textarea>
              <label for="foods">普通餐饮选项 <small>1–9 项</small></label
              ><p class="field-hint" id="food-help"
                >每行填写 Emoji、空格和名称。「你来决定」与「不另外安排吃饭」会自动保留。</p
              >
              <textarea
                id="foods"
                rows="7"
                maxlength="530"
                aria-describedby="food-help"
              ></textarea></div></details
          ><p class="field-hint">收到链接的人均可读取邀请内容，请勿填写手机号、住址或密码。</p>
          <button class="primary" type="submit"
            >生成邀请链接 <span aria-hidden="true">↗</span></button
          ></form
        >
        <p id="status" role="status" class="feedback"></p
        ><section id="result" hidden
          ><label for="url">邀请链接</label><textarea id="url" readonly rows="3"></textarea>
          <div class="actions"
            ><button id="copy-url" class="primary">复制链接</button
            ><a class="secondary" id="preview" target="_blank" rel="noopener">预览邀请 ↗</a></div
          ></section
        >
        <noscript>请开启 JavaScript 以生成邀请链接。</noscript></main
      ><footer class="foot">
        <span class="credit"><span class="air" aria-hidden="true"></span>Created by Leon Liu</span>
        <span>Date Invitation <b>·</b> V1.0</span></footer
      ></div
    ></body
  ></html
>
