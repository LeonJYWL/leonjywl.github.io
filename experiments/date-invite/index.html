<!doctype html>
<html lang="zh-CN"
  ><head>
    <meta charset="utf-8" /><meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#f6f4eb" /><title>Date Invitation · 有一封邀请</title>
    <link rel="icon" href="./assets/post.svg" /><link rel="stylesheet" href="./style.css" /><script
      type="module"
      src="./js/invite.js"
    ></script> </head
  ><body
    ><div class="shell"
      ><header class="mast"
        ><div class="brand"
          ><img src="./assets/post.svg" alt="" width="36" height="36" /><span
            >Date Invitation<span class="brand-dot">.</span></span
          ></div
        ><span class="version"><i></i> V1.0</span></header
      >
      <main id="main">
        <nav aria-label="邀请进度" class="progress"
          ><ol id="steps">
            <li aria-current="step">拆信</li
            ><li>活动</li
            ><li>时间</li
            ><li>餐饮</li
            ><li>票根</li></ol
          ></nav
        >
        <p id="warning" class="notice" hidden></p>
        <section id="first" class="postcard">
          <div class="art" aria-hidden="true"
            ><span class="art-label">CORRESPONDENCE</span><b class="cross c1">+</b>
            <div class="envelope"
              ><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 418" aria-hidden="true">
                <defs>
                  <linearGradient id="back" x2=".3" y2="1" gradientUnits="objectBoundingBox">
                    <stop stop-color="#799789" />
                    <stop offset="1" stop-color="#aebfaf" />
                  </linearGradient>
                  <linearGradient id="pocket" x1="0" x2="1" y1="0" y2="1">
                    <stop stop-color="#c6d1bb" />
                    <stop offset="1" stop-color="#a7bca9" />
                  </linearGradient>
                  <linearGradient id="flap" x2="0.2" y2="1">
                    <stop stop-color="#d7deca" />
                    <stop offset="1" stop-color="#b9cbb7" />
                  </linearGradient>
                  <radialGradient id="wax" cx=".34" cy=".26" r=".85">
                    <stop stop-color="#c88264" />
                    <stop offset=".67" stop-color="#b67155" />
                    <stop offset="1" stop-color="#965540" />
                  </radialGradient>
                  <filter id="shadow" x="-35%" y="-40%" width="180%" height="200%">
                    <feGaussianBlur stdDeviation="7" />
                  </filter>
                  <pattern id="grain" width="4" height="6" patternUnits="userSpaceOnUse">
                    <path
                      d="M0 0h.6m1.5 3h.6"
                      stroke="#344e43"
                      stroke-opacity=".18"
                      stroke-width=".65"
                    />
                  </pattern>
                  <pattern
                    id="stripe"
                    width="14"
                    height="9"
                    patternUnits="userSpaceOnUse"
                    patternTransform="rotate(-35)"
                  >
                    <path d="M0 0v9" stroke="#b77661" stroke-width="4" />
                    <path d="M7 0v9" stroke="#78998d" stroke-width="4" />
                  </pattern>
                  <g
                    id="sprig"
                    fill="none"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path
                      d="M0 31Q7 8 3-12M4 15Q-8 13-11 3Q0 5 4 15ZM5 7Q16 4 18-5Q8-3 5 7ZM5-1Q-5-4-8-13Q2-11 5-1ZM4-10Q1-19 6-25Q10-17 4-10Z"
                    />
                  </g>
                </defs>
                <!-- A botanical postage stamp, printed behind the envelope. -->
                <g transform="translate(374 40) rotate(12 42 49)" fill="none">
                  <path
                    d="M0 0h86v101H0z"
                    fill="#e8d3b6"
                    stroke="#aa725d"
                    stroke-width="1.3"
                    stroke-dasharray="2 3"
                  />
                  <rect x="5" y="5" width="76" height="91" stroke="#ab7761" />
                  <rect x="8" y="8" width="70" height="85" stroke="#ab7761" stroke-width=".6" />
                  <text
                    x="43"
                    y="21"
                    text-anchor="middle"
                    fill="#835642"
                    font-size="9"
                    font-family="Georgia,serif"
                    letter-spacing="2"
                  >
                    DATE POST
                  </text>
                  <use
                    href="#sprig"
                    transform="translate(43 52) rotate(12) scale(.87)"
                    color="#986449"
                  />
                  <text
                    x="43"
                    y="87"
                    text-anchor="middle"
                    fill="#835642"
                    font-size="9"
                    letter-spacing="2"
                  >
                    ✦ ✦ ✦
                  </text>
                </g>
                <g transform="translate(62 120) rotate(-9 202 105)">
                  <rect
                    x="1"
                    y="13"
                    width="401"
                    height="222"
                    rx="8"
                    fill="#536456"
                    opacity=".25"
                    filter="url(#shadow)"
                  />
                  <rect x="0" width="404" height="225" rx="5" fill="url(#back)" stroke="#809584" />
                  <g class="letter">
                    <rect
                      x="14"
                      y="9"
                      width="376"
                      height="202"
                      rx="3"
                      fill="#f7f1dc"
                      stroke="#c2bfa9"
                    />
                    <rect x="21" y="15" width="362" height="5" fill="url(#stripe)" />
                    <text
                      x="202"
                      y="63"
                      text-anchor="middle"
                      font-family="Georgia,serif"
                      font-style="italic"
                      fill="#476050"
                      font-size="26"
                    >
                      An invitation
                    </text>
                  </g>
                  <path d="M0 3l182 111L0 223z" fill="#b4c5ae" stroke="#91a792" />
                  <path d="M404 3L222 114l182 109z" fill="#a8bda9" stroke="#8ba08f" />
                  <path
                    d="M1 222l178-118q22-15 43-2l181 120q-2 3-7 3H7q-5 0-6-3z"
                    fill="url(#pocket)"
                    stroke="#91a58f"
                  />
                  <path
                    d="M4 217l176-115m46 0 173 116"
                    fill="none"
                    stroke="#e0e4cd"
                    stroke-opacity=".65"
                  />
                  <g class="flap">
                    <path
                      d="M1 1h402L215 136q-11 8-23 0z"
                      fill="#596e5b"
                      opacity=".18"
                      transform="translate(0 3)"
                    />
                    <path d="M1 1h402L214 131q-12 8-23 0z" fill="url(#flap)" stroke="#94a58d" />
                    <path
                      d="m9 4 184 123q10 7 20 0L395 4"
                      fill="none"
                      stroke="#e2e7d3"
                      stroke-width="1.7"
                    />
                  </g>
                  <rect width="404" height="225" rx="5" fill="url(#grain)" pointer-events="none" />
                  <g class="seal" transform="translate(203 125)">
                    <path
                      d="M-25-14q5-11 15-12 7-6 17-2 13 0 19 12 7 9 4 21 1 13-11 20-7 8-20 6-13 2-20-9-9-6-8-18-3-9 4-18z"
                      fill="#53624d"
                      opacity=".25"
                      transform="translate(0 4)"
                    />
                    <path
                      d="M-25-14q5-11 15-12 7-6 17-2 13 0 19 12 7 9 4 21 1 13-11 20-7 8-20 6-13 2-20-9-9-6-8-18-3-9 4-18z"
                      fill="url(#wax)"
                      stroke="#9c634a"
                    />
                    <circle r="21.5" fill="none" stroke="#d69d7b" stroke-width="1.3" />
                    <circle cy="1" r="20" fill="none" stroke="#a36149" />
                    <use href="#sprig" transform="rotate(17) scale(.57)" color="#edd0a8" />
                  </g>
                  <text
                    x="322"
                    y="197"
                    transform="rotate(-4 322 197)"
                    font-family="Georgia,serif"
                    font-size="20"
                    font-style="italic"
                    fill="#506b59"
                  >
                    for you
                  </text>
                </g>
                <g
                  transform="translate(438 328) rotate(10)"
                  fill="none"
                  stroke="#7b8e80"
                  opacity=".84"
                >
                  <circle r="35" stroke-width="1.5" />
                  <circle r="30.5" stroke-width=".8" />
                  <path d="M-31-12h62m-62 24h62" />
                  <text
                    y="4"
                    fill="#647e6b"
                    stroke="none"
                    text-anchor="middle"
                    letter-spacing="1.4"
                    font-family="Georgia,serif"
                    font-size="10"
                  >
                    BY HAND
                  </text>
                  <path d="M-33-4q-11-5-22-1t-22-1m44 10q-11-5-22-1t-22-1m44 10q-11-5-22-1t-22-1" />
                </g></svg></div
            ><div class="art-foot"
              ><span class="air"></span><span>POSTAL SERIES <b>✳</b></span></div
            ></div
          >
          <div class="letter-side">
            <div class="eyebrow"><i></i> ACT I <span>/</span> 拆信</div>
            <div id="closed"
              ><h1 tabindex="-1">有一封邀请，<br />想交给你<span class="period">。</span></h1>
              <p class="address"><em>To</em><span id="to"></span></p>
              <button class="primary" id="open"
                >拆开看看 <span aria-hidden="true">↗</span></button
              ></div
            >
            <div id="opened" hidden
              ><h1 id="letter-title" tabindex="-1">一封邀请<span class="period">。</span></h1
              ><div class="message" id="message"></div>
              <button id="accept" class="primary"
                >好呀，继续 <span aria-hidden="true">→</span></button
              >
              <div class="dodge-area"><button class="quiet" id="decline">再考虑一下</button></div
              ><p class="feedback" role="status" id="dodge-msg"></p
            ></div>
            <div class="sender"><em>From</em> <span id="from"></span></div></div
        ></section>
        <section id="workspace" hidden class="sheet"
          ><div id="act" class="eyebrow"></div><h1 id="heading" tabindex="-1"></h1
          ><p class="sub" id="sub"></p> <div id="choices"></div
          ><p role="status" class="feedback" id="feedback"></p>
          <button class="primary" id="next" disabled
            >继续 <span aria-hidden="true">→</span></button
          ></section
        >
        <section id="final" class="finish" hidden
          ><div id="ticket"></div
          ><p class="save-hint" id="save-hint" role="status"
            >请截图或保存这张票根，发给邀请你的人。</p
          >
          <div class="actions"
            ><button class="primary" id="save">保存图片 <span aria-hidden="true">↓</span></button
            ><button class="secondary restart">重新开始</button></div
          ></section
        >
        <section id="declined" class="sheet" hidden
          ><h1 tabindex="-1">收到，那这次就先不安排啦。</h1
          ><button class="secondary restart">重新开始</button></section
        >
        <noscript>请开启 JavaScript 以拆开这封互动邀请。</noscript></main
      ><footer class="foot"
        ><span class="air"></span><span>Date Invitation <b>·</b> V1.0</span></footer
      ></div
    ></body
  ></html
>
