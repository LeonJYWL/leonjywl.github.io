<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>鹈鹕骑行记 · 2D SVG 动态交互动画</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      font-family: 'Inter', 'Noto Sans SC', sans-serif;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }
    .glass-panel {
      background: rgba(255, 255, 255, 0.86);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.7);
    }
    .dark-glass {
      background: rgba(15, 23, 42, 0.82);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    input[type="range"] {
      accent-color: #f97316;
    }
    .stage-shadow {
      box-shadow: 0 20px 50px -12px rgba(15, 23, 42, 0.25);
    }
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    .float-badge {
      animation: floatSlow 3.2s ease-in-out infinite;
    }
  </style>
</head>
<body id="appBody" class="min-h-screen bg-gradient-to-b from-sky-100 via-amber-50 to-orange-50 text-slate-800 transition-colors duration-700 flex flex-col justify-between p-3 sm:p-5">

  <!-- Top Header Bar -->
  <header class="max-w-5xl w-full mx-auto flex flex-wrap items-center justify-between gap-3 mb-3">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-orange-500 to-amber-400 flex items-center justify-center text-white shadow-md shadow-orange-500/20 font-black text-xl">
        🚲
      </div>
      <div>
        <h1 id="mainTitle" class="text-lg sm:text-xl font-extrabold tracking-tight text-slate-900 transition-colors">
          海滨鹈鹕骑行记 <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-orange-100 text-orange-700 align-middle ml-1">2D SVG 骨骼逆向运动学动画</span>
        </h1>
        <p id="subTitle" class="text-xs text-slate-500 transition-colors">
          实时 60FPS 矢量骨骼解算 · 动态喉囊物理摆动 · 交互投喂与车铃音效
        </p>
      </div>
    </div>

    <!-- Real-time Telemetry Pill -->
    <div id="telemetryPanel" class="glass-panel rounded-2xl px-3.5 py-2 flex items-center gap-4 text-xs font-medium shadow-sm">
      <div class="flex items-center gap-1.5">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse" id="statusDot"></span>
        <span class="text-slate-500">踏频:</span>
        <span id="cadenceReadout" class="font-bold text-slate-800 tabular-nums">72 RPM</span>
      </div>
      <div class="h-3.5 w-px bg-slate-200"></div>
      <div class="flex items-center gap-1.5">
        <span class="text-slate-500">时速:</span>
        <span id="speedReadout" class="font-bold text-orange-600 tabular-nums">18.0 km/h</span>
      </div>
      <div class="h-3.5 w-px bg-slate-200"></div>
      <div class="flex items-center gap-1.5">
        <span class="text-slate-500">已炫小鱼:</span>
        <span id="fishCountReadout" class="font-bold text-sky-600 tabular-nums">3 条</span>
      </div>
    </div>
  </header>

  <!-- Main SVG Stage Container -->
  <main class="max-w-5xl w-full mx-auto flex-1 flex flex-col justify-center">
    <div class="relative w-full rounded-3xl overflow-hidden stage-shadow border-4 border-white/90 bg-sky-200 aspect-[16/9]">
      
      <!-- Floating Interactive Hint -->
      <div class="absolute top-3 left-3 z-10 pointer-events-none flex flex-wrap gap-2">
        <div class="glass-panel px-3 py-1 rounded-full text-xs font-semibold text-slate-700 shadow-sm float-badge">
          💡 提示：点击画面任意位置或下方按钮可抛投小鱼喂食鹈鹕！
        </div>
      </div>

      <!-- Scene Quick Theme Switcher in Top Right of Canvas -->
      <div class="absolute top-3 right-3 z-10 flex items-center gap-1.5 glass-panel p-1 rounded-full shadow-sm">
        <button id="themeDayBtn" type="button" class="px-2.5 py-1 rounded-full text-xs font-bold transition-all bg-amber-400 text-slate-900 shadow-sm" title="晴朗海滨">
          ☀️ 晴日
        </button>
        <button id="themeSunsetBtn" type="button" class="px-2.5 py-1 rounded-full text-xs font-bold transition-all text-slate-600 hover:text-slate-900" title="落日余晖">
          🌅 晚霞
        </button>
        <button id="themeNightBtn" type="button" class="px-2.5 py-1 rounded-full text-xs font-bold transition-all text-slate-600 hover:text-slate-900" title="星夜灯塔">
          🌙 星夜
        </button>
      </div>

      <!-- THE 2D SVG ANIMATION VIEWPORT -->
      <svg id="pelicanSvg" viewBox="0 0 960 540" class="w-full h-full block cursor-pointer" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- Sky Gradients -->
          <linearGradient id="skyGradDay" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#38bdf8" />
            <stop offset="55%" stop-color="#bae6fd" />
            <stop offset="100%" stop-color="#fef3c7" />
          </linearGradient>
          <linearGradient id="skyGradSunset" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#311042" />
            <stop offset="35%" stop-color="#9d174d" />
            <stop offset="70%" stop-color="#f97316" />
            <stop offset="100%" stop-color="#fde047" />
          </linearGradient>
          <linearGradient id="skyGradNight" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#020617" />
            <stop offset="55%" stop-color="#0f172a" />
            <stop offset="100%" stop-color="#1e293b" />
          </linearGradient>

          <!-- Ocean Gradients -->
          <linearGradient id="seaGradDay" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#0284c7" />
            <stop offset="100%" stop-color="#0369a1" />
          </linearGradient>
          <linearGradient id="seaGradSunset" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#7c2d12" />
            <stop offset="40%" stop-color="#be123c" />
            <stop offset="100%" stop-color="#311042" />
          </linearGradient>
          <linearGradient id="seaGradNight" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#0f172a" />
            <stop offset="100%" stop-color="#020617" />
          </linearGradient>

          <!-- Pelican Beak & Pouch Gradients -->
          <linearGradient id="beakUpperGrad" x1="0%" y1="0%" x2="100%" y2="15%">
            <stop offset="0%" stop-color="#fde047" />
            <stop offset="55%" stop-color="#fb923c" />
            <stop offset="100%" stop-color="#ea580c" />
          </linearGradient>
          <linearGradient id="pouchGrad" x1="20%" y1="0%" x2="70%" y2="100%">
            <stop offset="0%" stop-color="#fdba74" />
            <stop offset="45%" stop-color="#f97316" />
            <stop offset="100%" stop-color="#c2410c" />
          </linearGradient>
          <linearGradient id="pelicanBodyGrad" x1="0%" y1="0%" x2="80%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="70%" stop-color="#f8fafc" />
            <stop offset="100%" stop-color="#cbd5e1" />
          </linearGradient>
          <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="65%" stop-color="#e2e8f0" />
            <stop offset="100%" stop-color="#94a3b8" />
          </linearGradient>

          <!-- Bicycle Frame Metallic Mint/Teal Gradient -->
          <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#14b8a6" />
            <stop offset="50%" stop-color="#0d9488" />
            <stop offset="100%" stop-color="#115e59" />
          </linearGradient>

          <!-- Chrome Metallic Gradient -->
          <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#f8fafc" />
            <stop offset="50%" stop-color="#cbd5e1" />
            <stop offset="100%" stop-color="#64748b" />
          </linearGradient>

          <!-- Tire Rim Gradient -->
          <radialGradient id="wheelGlow" cx="50%" cy="50%" r="50%">
            <stop offset="75%" stop-color="rgba(255,255,255,0)" />
            <stop offset="100%" stop-color="rgba(56,189,248,0.18)" />
          </radialGradient>

          <!-- Headlamp Light Cone for Night Mode -->
          <linearGradient id="headlampCone" x1="0%" y1="50%" x2="100%" y2="50%">
            <stop offset="0%" stop-color="rgba(254, 240, 138, 0.75)" />
            <stop offset="60%" stop-color="rgba(254, 240, 138, 0.22)" />
            <stop offset="100%" stop-color="rgba(254, 240, 138, 0)" />
          </linearGradient>

          <!-- Reusable Wheel Spokes Group -->
          <g id="wheelSpokes">
            <line x1="-70" y1="0" x2="70" y2="0" stroke="#e2e8f0" stroke-width="1.6" />
            <line x1="0" y1="-70" x2="0" y2="70" stroke="#e2e8f0" stroke-width="1.6" />
            <line x1="-49.5" y1="-49.5" x2="49.5" y2="49.5" stroke="#e2e8f0" stroke-width="1.6" />
            <line x1="-49.5" y1="49.5" x2="49.5" y2="-49.5" stroke="#e2e8f0" stroke-width="1.6" />
            <line x1="-64.7" y1="-26.8" x2="64.7" y2="26.8" stroke="#cbd5e1" stroke-width="1.3" />
            <line x1="-26.8" y1="-64.7" x2="26.8" y2="64.7" stroke="#cbd5e1" stroke-width="1.3" />
            <line x1="-64.7" y1="26.8" x2="64.7" y2="-26.8" stroke="#cbd5e1" stroke-width="1.3" />
            <line x1="-26.8" y1="64.7" x2="26.8" y2="-64.7" stroke="#cbd5e1" stroke-width="1.3" />
            <!-- Rim -->
            <circle cx="0" cy="0" r="67" fill="none" stroke="#f1f5f9" stroke-width="4" />
            <!-- Whitewall tire inner stripe -->
            <circle cx="0" cy="0" r="71" fill="none" stroke="#fef3c7" stroke-width="3" />
            <!-- Outer rubber tire -->
            <circle cx="0" cy="0" r="76" fill="none" stroke="#1e293b" stroke-width="9" />
            <!-- Tire tread notches -->
            <circle cx="0" cy="0" r="80.5" fill="none" stroke="#0f172a" stroke-width="2" stroke-dasharray="6 8" />
            <!-- Valve stem & reflector -->
            <rect x="-2" y="57" width="4" height="8" rx="1" fill="#94a3b8" />
            <rect x="42" y="-5" width="7" height="10" rx="3" fill="#f97316" stroke="#fff" stroke-width="1" />
            <rect x="-49" y="-5" width="7" height="10" rx="3" fill="#f97316" stroke="#fff" stroke-width="1" />
          </g>

          <!-- Reusable Fish Symbol -->
          <g id="fishGraphic">
            <path d="M -18,0 C -10,-9 8,-9 18,0 C 8,9 -10,9 -18,0 Z" fill="#38bdf8" stroke="#0369a1" stroke-width="1.5" />
            <path d="M -4,-6 C 2,-8 10,-6 15,0 C 10,3 2,3 -4,-6 Z" fill="#bae6fd" opacity="0.7" />
            <polygon points="-16,0 -26,-8 -23,0 -26,8" fill="#0284c7" stroke="#0369a1" stroke-width="1.2" stroke-linejoin="round" />
            <circle cx="10" cy="-2" r="2" fill="#0f172a" />
            <circle cx="10.7" cy="-2.5" r="0.7" fill="#ffffff" />
          </g>
        </defs>

        <!-- 1. SKY BACKGROUND -->
        <rect id="skyRect" x="0" y="0" width="960" height="420" fill="url(#skyGradDay)" />

        <!-- Stars Group (Visible in Night/Sunset) -->
        <g id="starsGroup" opacity="0" style="transition: opacity 0.8s ease;">
          <circle cx="110" cy="55" r="1.8" fill="#fff" opacity="0.9" />
          <circle cx="240" cy="85" r="1.2" fill="#fde047" opacity="0.8" />
          <circle cx="370" cy="40" r="2.1" fill="#fff" opacity="0.95" />
          <circle cx="520" cy="75" r="1.5" fill="#fff" opacity="0.75" />
          <circle cx="680" cy="48" r="2.2" fill="#fde047" opacity="0.9" />
          <circle cx="830" cy="92" r="1.6" fill="#fff" opacity="0.85" />
          <circle cx="890" cy="38" r="1.9" fill="#fff" opacity="0.8" />
          <circle cx="165" cy="135" r="1.4" fill="#fff" opacity="0.7" />
          <circle cx="610" cy="120" r="1.3" fill="#fff" opacity="0.7" />
          <circle cx="445" cy="105" r="1.7" fill="#bae6fd" opacity="0.9" />
        </g>

        <!-- Sun / Moon Orb -->
        <g id="celestialGroup" transform="translate(770, 95)">
          <circle id="sunHalo" cx="0" cy="0" r="68" fill="#fef08a" opacity="0.28" />
          <circle id="sunCore" cx="0" cy="0" r="44" fill="#fde047" />
          <!-- Moon crater overlay (hidden in day) -->
          <g id="moonCraters" opacity="0">
            <circle cx="-12" cy="-10" r="7" fill="#cbd5e1" opacity="0.5" />
            <circle cx="14" cy="8" r="10" fill="#cbd5e1" opacity="0.4" />
            <circle cx="-6" cy="16" r="5" fill="#cbd5e1" opacity="0.45" />
          </g>
        </g>

        <!-- Parallax Clouds Layer -->
        <g id="cloudsLayer" opacity="0.92">
          <g class="cloud-item" data-x="120" data-speed="0.18" transform="translate(120, 78)">
            <path d="M 0,20 Q 15,-5 42,5 Q 68,-14 95,6 Q 122,2 130,22 Q 135,34 115,35 L -5,35 Q -15,30 0,20 Z" fill="#ffffff" opacity="0.88" />
          </g>
          <g class="cloud-item" data-x="480" data-speed="0.12" transform="translate(480, 52) scale(0.82)">
            <path d="M 0,20 Q 15,-5 42,5 Q 68,-14 95,6 Q 122,2 130,22 Q 135,34 115,35 L -5,35 Q -15,30 0,20 Z" fill="#ffffff" opacity="0.75" />
          </g>
          <g class="cloud-item" data-x="820" data-speed="0.22" transform="translate(820, 105) scale(1.05)">
            <path d="M 0,20 Q 15,-5 42,5 Q 68,-14 95,6 Q 122,2 130,22 Q 135,34 115,35 L -5,35 Q -15,30 0,20 Z" fill="#ffffff" opacity="0.85" />
          </g>
        </g>

        <!-- Distant Animated Seagulls -->
        <g id="seagullsLayer">
          <path id="gull1" d="M 0,0 Q 8,-9 16,0 Q 24,-9 32,0" fill="none" stroke="#475569" stroke-width="2.2" stroke-linecap="round" transform="translate(220, 130)" />
          <path id="gull2" d="M 0,0 Q 6,-7 12,0 Q 18,-7 24,0" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" transform="translate(260, 148)" />
        </g>

        <!-- Distant Island & Lighthouse Parallax Layer -->
        <g id="islandLayer" transform="translate(180, 230)">
          <!-- Island hill -->
          <path d="M -90,95 Q -30,35 55,48 Q 115,58 165,95 Z" fill="#0f766e" opacity="0.45" />
          <!-- Lighthouse tower -->
          <polygon points="32,55 46,55 43,5 35,5" fill="#f8fafc" />
          <polygon points="33.5,38 44.5,38 44,26 34,26" fill="#ef4444" />
          <polygon points="34.5,18 43.5,18 43,10 35,10" fill="#ef4444" />
          <rect x="33" y="1" width="12" height="5" rx="1" fill="#1e293b" />
          <path d="M 33,1 L 39,-6 L 45,1 Z" fill="#ef4444" />
          <!-- Lighthouse rotating beam (visible at night) -->
          <polygon id="lighthouseBeam" points="39,3 260,-35 260,42" fill="url(#headlampCone)" opacity="0" />
        </g>

        <!-- 2. OCEAN & WAVES -->
        <rect id="seaRect" x="0" y="318" width="960" height="92" fill="url(#seaGradDay)" />
        
        <!-- Animated Wave Crests -->
        <g id="wavesLayer" opacity="0.65">
          <path id="wavePath1" d="M -120,338 Q -90,330 -60,338 T 0,338 T 60,338 T 120,338 T 180,338 T 240,338 T 300,338 T 360,338 T 420,338 T 480,338 T 540,338 T 600,338 T 660,338 T 720,338 T 780,338 T 840,338 T 900,338 T 960,338 T 1020,338 T 1080,338" fill="none" stroke="#bae6fd" stroke-width="2.5" stroke-linecap="round" />
          <path id="wavePath2" d="M -120,362 Q -80,354 -40,362 T 40,362 T 120,362 T 200,362 T 280,362 T 360,362 T 440,362 T 520,362 T 600,362 T 680,362 T 760,362 T 840,362 T 920,362 T 1000,362 T 1080,362" fill="none" stroke="#7dd3fc" stroke-width="2" stroke-linecap="round" />
        </g>

        <!-- 3. COASTAL BOARDWALK / PROMENADE DECK -->
        <!-- Sandy beach strip -->
        <rect x="0" y="392" width="960" height="28" fill="#fde68a" />
        <path d="M 0,392 Q 160,386 320,392 T 640,392 T 960,392" fill="none" stroke="#fef3c7" stroke-width="4" />

        <!-- Boardwalk Wooden Railing Posts (Scrolling in Parallax) -->
        <g id="railingLayer">
          <!-- Top handrail繩/bar -->
          <line x1="0" y1="378" x2="960" y2="378" stroke="#d97706" stroke-width="4" opacity="0.7" />
          <g id="railingPosts"></g>
        </g>

        <!-- Main Road / Boardwalk Surface -->
        <rect id="roadRect" x="0" y="410" width="960" height="130" fill="#475569" />
        <!-- Sidewalk Curb -->
        <rect x="0" y="406" width="960" height="8" fill="#cbd5e1" />
        <line x1="0" y1="414" x2="960" y2="414" stroke="#334155" stroke-width="2" />

        <!-- Scrolling Dashed Bike Lane Line -->
        <line id="roadDashes" x1="-120" y1="468" x2="1080" y2="468" stroke="#fbbf24" stroke-width="5" stroke-dasharray="42 38" stroke-linecap="round" />
        <!-- Passing Pebbles / Speed Lines on Road -->
        <g id="roadPebbles" opacity="0.45">
          <rect x="140" y="495" width="18" height="3" rx="1.5" fill="#94a3b8" />
          <rect x="420" y="510" width="26" height="3" rx="1.5" fill="#94a3b8" />
          <rect x="730" y="488" width="15" height="3" rx="1.5" fill="#94a3b8" />
          <rect x="880" y="515" width="22" height="3" rx="1.5" fill="#94a3b8" />
        </g>

        <!-- ============================================================== -->
        <!-- 4. PELICAN + BICYCLE MASTER RIG                                -->
        <!-- ============================================================== -->
        <!-- Dynamic Ground Shadow underneath bicycle -->
        <ellipse id="bikeShadow" cx="465" cy="442" rx="195" ry="13" fill="#0f172a" opacity="0.28" />

        <g id="bikeMasterGroup" transform="translate(0, 0)">

          <!-- Night Mode Bicycle Headlamp Beam -->
          <polygon id="bikeLightBeam" points="585,236 950,175 950,395" fill="url(#headlampCone)" opacity="0" style="transition: opacity 0.5s ease;" />

          <!-- LAYER A: FAR (LEFT) PELICAN LEG & FAR PEDAL (Behind Frame) -->
          <g id="farSideLayer">
            <!-- Far Crank Arm -->
            <line id="farCrankLine" x1="435" y1="362" x2="435" y2="330" stroke="#475569" stroke-width="7" stroke-linecap="round" />
            <!-- Far Pedal Platform -->
            <rect id="farPedalRect" x="421" y="325" width="28" height="8" rx="3" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5" />

            <!-- Far Pelican Thigh (Feathered) -->
            <line id="farThigh" x1="378" y1="224" x2="430" y2="290" stroke="#cbd5e1" stroke-width="20" stroke-linecap="round" />
            <!-- Far Pelican Lower Leg (Orange scaly tarsus) -->
            <line id="farShin" x1="430" y1="290" x2="435" y2="330" stroke="#d97706" stroke-width="9.5" stroke-linecap="round" />
            <!-- Far Webbed Foot -->
            <path id="farFoot" d="M 425,330 L 456,333 L 450,322 Z" fill="#ea580c" stroke="#c2410c" stroke-width="2" stroke-linejoin="round" />
          </g>

          <!-- LAYER B: BICYCLE WHEELS -->
          <!-- Rear Wheel Center: (310, 362) -->
          <g id="rearWheelGroup" transform="translate(310, 362)">
            <circle cx="0" cy="0" r="82" fill="url(#wheelGlow)" />
            <use href="#wheelSpokes" />
            <circle cx="0" cy="0" r="12" fill="#334155" stroke="#e2e8f0" stroke-width="3" />
          </g>

          <!-- Front Wheel Center: (615, 362) -->
          <g id="frontWheelGroup" transform="translate(615, 362)">
            <circle cx="0" cy="0" r="82" fill="url(#wheelGlow)" />
            <use href="#wheelSpokes" />
            <circle cx="0" cy="0" r="11" fill="#0d9488" stroke="#f8fafc" stroke-width="3" />
          </g>

          <!-- LAYER C: BICYCLE FRAME & DRIVETRAIN -->
          <g id="bicycleFrameGroup">
            <!-- Rear Fender -->
            <path d="M 224,352 A 86,86 0 0,1 384,316" fill="none" stroke="#0f766e" stroke-width="7" stroke-linecap="round" />
            <path d="M 224,352 A 86,86 0 0,1 384,316" fill="none" stroke="#99f6e4" stroke-width="2" stroke-linecap="round" />
            <!-- Front Fender -->
            <path d="M 542,312 A 86,86 0 0,1 698,342" fill="none" stroke="#0f766e" stroke-width="7" stroke-linecap="round" />
            <path d="M 542,312 A 86,86 0 0,1 698,342" fill="none" stroke="#99f6e4" stroke-width="2" stroke-linecap="round" />

            <!-- Rear Luggage Rack (With Red Tail Reflector) -->
            <polyline points="310,362 275,264 362,264" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" />
            <line x1="310" y1="362" x2="332" y2="264" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" />
            <rect x="266" y="261" width="8" height="14" rx="3" fill="#ef4444" stroke="#fff" stroke-width="1" />

            <!-- Bicycle Chain (Animated dashoffset) -->
            <path id="bikeChain" d="M 310,350 L 435,337 A 25,25 0 1,1 435,387 L 310,374 A 12,12 0 1,1 310,350 Z" fill="none" stroke="#334155" stroke-width="4.5" stroke-dasharray="6 5" />

            <!-- Main Frame Tubes -->
            <!-- Chainstay -->

      function getAudioContext() {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) {
            audioCtx = new AudioContextClass();
          }
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        return audioCtx;
      }

      function playBellSound() {
        if (!state.soundEnabled) return;
        const ctx = getAudioContext();
        if (!ctx) return;
        const now = ctx.currentTime;
        // Double metallic bicycle "brring-brring"
        const freqs = [1760, 2637, 1760, 2637];
        freqs.forEach((f, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(f, now + idx * 0.065);
          gain.gain.setValueAtTime(0.16, now + idx * 0.065);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.065 + 0.45);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + idx * 0.065);
          osc.stop(now + idx * 0.065 + 0.46);
        });
      }

      function playSplashTossSound() {
        if (!state.soundEnabled) return;
        const ctx = getAudioContext();
        if (!ctx) return;
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(320, now);
        osc.frequency.exponentialRampToValueAtTime(780, now + 0.18);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.21);
      }

      function playGulpSound() {
        if (!state.soundEnabled) return;
        const ctx = getAudioContext();
        if (!ctx) return;
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(420, now);
        osc.frequency.exponentialRampToValueAtTime(160, now + 0.14);
        osc.frequency.exponentialRampToValueAtTime(520, now + 0.26);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.29);
      }

      // =========================================================================
      // 4. 2-BONE ANALYTIC INVERSE KINEMATICS SOLVER
      // =========================================================================
      /**
       * Solves 2D two-segment joint position (e.g. knee or elbow) given root (hip/shoulder)
       * and target (foot/hand), segment lengths L1, L2, and bend direction (+1 or -1).
       */
      function solveTwoBoneIK(rootX, rootY, targetX, targetY, L1, L2, bendDir) {
        let dx = targetX - rootX;
        let dy = targetY - rootY;
        let dist = Math.hypot(dx, dy);

        // Clamp distance to prevent unreachable NaN
        const maxReach = (L1 + L2) * 0.995;
        const minReach = Math.abs(L1 - L2) + 2;
        if (dist > maxReach) {
          const scale = maxReach / dist;
          dx *= scale;
          dy *= scale;
          dist = maxReach;
        } else if (dist < minReach) {
          dist = minReach;
        }

        // Law of cosines for angle at root
        const cosAngle = (L1 * L1 + dist * dist - L2 * L2) / (2 * L1 * dist);
        const clampedCos = Math.max(-1, Math.min(1, cosAngle));
        const baseAngle = Math.atan2(dy, dx);
        const offsetAngle = Math.acos(clampedCos);

        const jointAngle = baseAngle + bendDir * offsetAngle;
        return {
          x: rootX + L1 * Math.cos(jointAngle),
          y: rootY + L1 * Math.sin(jointAngle)
        };
      }

      // =========================================================================
      // 8. MAIN 60FPS ANIMATION LOOP
      // =========================================================================
      let lastTime = performance.now();

      function updateFrame(now) {
        const dt = Math.min(0.05, (now - lastTime) / 1000);
        lastTime = now;

        // Decay sprint boost smoothly
        if (state.sprintBoost > 0) {
          state.sprintBoost = Math.max(0, state.sprintBoost - dt * 0.9);
        }

        const effectiveSpeed = state.isPlaying ? (state.speedMultiplier + state.sprintBoost) : 0;

        // Update Telemetry UI
        const rpm = Math.round(effectiveSpeed * 72);
        const kmh = (effectiveSpeed * 18).toFixed(1);
        cadenceReadout.textContent = rpm + ' RPM';
        speedReadout.textContent = kmh + ' km/h';

        // Advance Crank & Wheel Rotation
        const angularVel = effectiveSpeed * 5.2; // rad/sec
        state.crankAngle = (state.crankAngle + angularVel * dt) % (Math.PI * 2);
        state.wheelAngle = (state.wheelAngle + (angularVel * 2.1 * 180 / Math.PI) * dt) % 360;

        // 1. Rotate Both Wheels & Chainring
        rearWheelGroup.setAttribute('transform', `translate(310, 362) rotate(${state.wheelAngle.toFixed(1)})`);
        frontWheelGroup.setAttribute('transform', `translate(615, 362) rotate(${state.wheelAngle.toFixed(1)})`);
        const crankDeg = (state.crankAngle * 180 / Math.PI).toFixed(1);
        chainringGroup.setAttribute('transform', `translate(435, 362) rotate(${crankDeg})`);
        bikeChain.setAttribute('stroke-dashoffset', (-state.wheelAngle * 0.45).toFixed(1));

        // 2. Compute Near & Far Pedal Coordinates
        const nearPedalX = CRANK_CENTER.x + CRANK_RADIUS * Math.cos(state.crankAngle);
        const nearPedalY = CRANK_CENTER.y + CRANK_RADIUS * Math.sin(state.crankAngle);

        const farAngle = state.crankAngle + Math.PI;
        const farPedalX = CRANK_CENTER.x + CRANK_RADIUS * Math.cos(farAngle);
        const farPedalY = CRANK_CENTER.y + CRANK_RADIUS * Math.sin(farAngle);

        // Update Crank Arms & Horizontal Pedal Platforms
        nearCrankLine.setAttribute('x2', nearPedalX.toFixed(1));
        nearCrankLine.setAttribute('y2', nearPedalY.toFixed(1));
        nearPedalRect.setAttribute('x', (nearPedalX - 14).toFixed(1));
        nearPedalRect.setAttribute('y', (nearPedalY - 3).toFixed(1));

        farCrankLine.setAttribute('x2', farPedalX.toFixed(1));
        farCrankLine.setAttribute('y2', farPedalY.toFixed(1));
        farPedalRect.setAttribute('x', (farPedalX - 14).toFixed(1));
        farPedalRect.setAttribute('y', (farPedalY - 3).toFixed(1));

        // 3. Pelican Torso Rhythmic Bounce (Twice per pedal revolution)
        const bodyBobY = Math.sin(state.crankAngle * 2) * 5.5;
        const bodyPitchDeg = Math.cos(state.crankAngle * 2) * 1.8;
        const bikeSuspensionY = Math.sin(state.crankAngle * 2 - 0.4) * 1.6;

        bikeMasterGroup.setAttribute('transform', `translate(0, ${bikeSuspensionY.toFixed(2)})`);
        bikeShadow.setAttribute('rx', (195 + bodyBobY * 1.2).toFixed(1));

        const hipX = BASE_HIP.x;
        const hipY = BASE_HIP.y + bodyBobY;
        pelicanTorsoGroup.setAttribute('transform', `translate(0, ${bodyBobY.toFixed(2)}) rotate(${bodyPitchDeg.toFixed(2)}, 395, 195)`);

        // Wag tail feathers
        const tailWag = Math.sin(state.crankAngle * 2 + 0.8) * 7;
        pelicanTail.setAttribute('transform', `translate(328, 198) rotate(${tailWag.toFixed(1)})`);

        // 4. Solve 2-Bone IK for Near & Far Pelican Legs (Knee bends forward: bendDir = -1)
        const nearAnkleX = nearPedalX - 4;
        const nearAnkleY = nearPedalY - 4;
        const nearKnee = solveTwoBoneIK(hipX, hipY, nearAnkleX, nearAnkleY, THIGH_LEN, SHIN_LEN, -1);

        nearThigh.setAttribute('x1', hipX.toFixed(1));
        nearThigh.setAttribute('y1', hipY.toFixed(1));
        nearThigh.setAttribute('x2', nearKnee.x.toFixed(1));
        nearThigh.setAttribute('y2', nearKnee.y.toFixed(1));

        nearThighOutline.setAttribute('x1', hipX.toFixed(1));
        nearThighOutline.setAttribute('y1', hipY.toFixed(1));
        nearThighOutline.setAttribute('x2', nearKnee.x.toFixed(1));
        nearThighOutline.setAttribute('y2', nearKnee.y.toFixed(1));

        nearHipCover.setAttribute('cx', hipX.toFixed(1));
        nearHipCover.setAttribute('cy', hipY.toFixed(1));

        nearShin.setAttribute('x1', nearKnee.x.toFixed(1));
        nearShin.setAttribute('y1', nearKnee.y.toFixed(1));
        nearShin.setAttribute('x2', nearAnkleX.toFixed(1));
        nearShin.setAttribute('y2', nearAnkleY.toFixed(1));

        // Foot tilts slightly with pedal phase
        const nearFootTilt = Math.cos(state.crankAngle) * 4;
        nearFoot.setAttribute('d', `M ${(nearAnkleX - 8).toFixed(1)},${(nearAnkleY + 2).toFixed(1)} L ${(nearAnkleX + 28).toFixed(1)},${(nearAnkleY + 4 + nearFootTilt).toFixed(1)} L ${(nearAnkleX + 22).toFixed(1)},${(nearAnkleY - 8 + nearFootTilt).toFixed(1)} Z`);

        // Far Leg IK
        const farHipX = hipX + 4;
        const farHipY = hipY - 3;
        const farAnkleX = farPedalX - 4;
        const farAnkleY = farPedalY - 4;
        const farKnee = solveTwoBoneIK(farHipX, farHipY, farAnkleX, farAnkleY, THIGH_LEN, SHIN_LEN, -1);

        farThigh.setAttribute('x1', farHipX.toFixed(1));
        farThigh.setAttribute('y1', farHipY.toFixed(1));
        farThigh.setAttribute('x2', farKnee.x.toFixed(1));
        farThigh.setAttribute('y2', farKnee.y.toFixed(1));

        farShin.setAttribute('x1', farKnee.x.toFixed(1));
        farShin.setAttribute('y1', farKnee.y.toFixed(1));
        farShin.setAttribute('x2', farAnkleX.toFixed(1));
        farShin.setAttribute('y2', farAnkleY.toFixed(1));

        const farFootTilt = Math.cos(farAngle) * 4;
        farFoot.setAttribute('d', `M ${(farAnkleX - 8).toFixed(1)},${(farAnkleY + 2).toFixed(1)} L ${(farAnkleX + 28).toFixed(1)},${(farAnkleY + 4 + farFootTilt).toFixed(1)} L ${(farAnkleX + 22).toFixed(1)},${(farAnkleY - 8 + farFootTilt).toFixed(1)} Z`);

        // 5. Solve 2-Bone IK for Pelican Wing Holding Handlebar (Bend downward: bendDir = +1)
        const shoulderX = BASE_SHOULDER.x;
        const shoulderY = BASE_SHOULDER.y + bodyBobY;
        const elbow = solveTwoBoneIK(shoulderX, shoulderY, HANDLEBAR_GRIP.x, HANDLEBAR_GRIP.y, UPPER_WING_LEN, LOWER_WING_LEN, 1);

        wingUpper.setAttribute('x1', shoulderX.toFixed(1));
        wingUpper.setAttribute('y1', shoulderY.toFixed(1));
        wingUpper.setAttribute('x2', elbow.x.toFixed(1));
        wingUpper.setAttribute('y2', elbow.y.toFixed(1));

        wingUpperFill.setAttribute('x1', shoulderX.toFixed(1));
        wingUpperFill.setAttribute('y1', shoulderY.toFixed(1));
        wingUpperFill.setAttribute('x2', elbow.x.toFixed(1));
        wingUpperFill.setAttribute('y2', elbow.y.toFixed(1));

        wingLower.setAttribute('x1', elbow.x.toFixed(1));
        wingLower.setAttribute('y1', elbow.y.toFixed(1));
        wingLower.setAttribute('x2', HANDLEBAR_GRIP.x.toFixed(1));
        wingLower.setAttribute('y2', HANDLEBAR_GRIP.y.toFixed(1));

        wingLowerFill.setAttribute('x1', elbow.x.toFixed(1));
        wingLowerFill.setAttribute('y1', elbow.y.toFixed(1));
        wingLowerFill.setAttribute('x2', HANDLEBAR_GRIP.x.toFixed(1));
        wingLowerFill.setAttribute('y2', HANDLEBAR_GRIP.y.toFixed(1));

        wingElbowJoint.setAttribute('cx', elbow.x.toFixed(1));
        wingElbowJoint.setAttribute('cy', elbow.y.toFixed(1));

        // 6. Dynamic Throat Pouch Jiggle, Gulp & Head Nod
        state.pouchGulpOpen = Math.max(0, state.pouchGulpOpen - dt * 1.6);
        state.pouchBulge = Math.max(0, state.pouchBulge - dt * 1.4);

        const bounceDrive = Math.cos(state.crankAngle * 2) * 8 * Math.min(1.6, effectiveSpeed + 0.2);
        const pouchSag = 52 + bounceDrive + state.pouchGulpOpen * 30 + Math.sin(now * 0.018) * state.pouchBulge * 18;
        const pouchMidX = 72 + Math.sin(state.crankAngle * 2 - 0.6) * 5;

        gularPouch.setAttribute(
          'd',
          `M 12,2 C 34,${(pouchSag * 0.92).toFixed(1)} ${pouchMidX.toFixed(1)},${(pouchSag * 1.08).toFixed(1)} 136,6 C 95,${(8 + state.pouchGulpOpen * 14).toFixed(1)} 48,4 12,2 Z`
        );
        pouchCrease1.setAttribute(
          'd',
          `M 28,12 Q ${pouchMidX.toFixed(1)},${(pouchSag * 0.72).toFixed(1)} 114,8`
        );
        pouchCrease2.setAttribute(
          'd',
          `M 44,18 Q ${(pouchMidX + 4).toFixed(1)},${(pouchSag * 0.56).toFixed(1)} 102,10`
        );

        // Upper beak opens upward when catching a fish
        const beakOpenAngle = -state.pouchGulpOpen * 16;
        upperBeakGroup.setAttribute('transform', `rotate(${beakOpenAngle.toFixed(1)}, 14, -4)`);

        const headNod = Math.sin(state.crankAngle * 2 - 0.5) * 3.2 - state.pouchGulpOpen * 6;
        pelicanHead.setAttribute('transform', `translate(462, 82) rotate(${headNod.toFixed(2)})`);

        // Basket fish jiggle
        const basketJiggle = Math.sin(state.crankAngle * 2) * 4;
        basketFishGroup.setAttribute('transform', `translate(6, ${(-4 + basketJiggle * 0.4).toFixed(1)}) rotate(${(-25 + basketJiggle).toFixed(1)})`);

        // 7. Fluttering Nautical Scarf
        state.wavePhase += dt * (4 + effectiveSpeed * 5);
        const s1 = Math.sin(state.wavePhase * 1.8) * 10;
        const s2 = Math.cos(state.wavePhase * 1.8) * 12;
        const scarfPath1 = `M -12,4 Q -55,${(-14 + s1).toFixed(1)} -95,${(-4 - s1 * 0.7).toFixed(1)} Q -120,${(2 + s2).toFixed(1)} -142,${(-8 - s2).toFixed(1)}`;
        scarfTail1.setAttribute('d', scarfPath1);
        scarfTail1Stripe.setAttribute('d', scarfPath1);
        scarfTail2.setAttribute(
          'd',
          `M -14,10 Q -52,${(6 - s1 * 0.8).toFixed(1)} -88,${(16 + s2 * 0.8).toFixed(1)} Q -112,${(22 - s1).toFixed(1)} -130,${(14 + s2).toFixed(1)}`
        );

        // 8. Periodic Eye Blinking
        state.blinkTimer += dt;
        if (!state.isBlinking && state.blinkTimer > 3.4) {
          state.isBlinking = true;
          state.blinkTimer = 0;
          eyeBlinkLid.setAttribute('opacity', '1');
        } else if (state.isBlinking && state.blinkTimer > 0.14) {
          state.isBlinking = false;
          state.blinkTimer = 0;
          eyeBlinkLid.setAttribute('opacity', '0');
        }

        // 9. Bell Ring Visual Timer
        if (state.bellTimer > 0) {
          state.bellTimer = Math.max(0, state.bellTimer - dt);
          bellRings.setAttribute('opacity', (state.bellTimer / 0.6).toFixed(2));
        }

        // 10. Scroll Road Dashes, Boardwalk Posts, Clouds & Waves
        const groundScrollSpeed = effectiveSpeed * 210; // px/sec
        state.roadScroll = (state.roadScroll + groundScrollSpeed * dt) % 80;
        roadDashes.setAttribute('transform', `translate(${-state.roadScroll.toFixed(1)}, 0)`);

        state.railingOffset = (state.railingOffset + groundScrollSpeed * 0.65 * dt) % POST_SPACING;
        for (let i = 0; i < NUM_POSTS; i++) {
          const px = i * POST_SPACING - state.railingOffset;
          postEls[i].setAttribute('x', px.toFixed(1));
        }

        // Waves gentle oscillation
        const waveShift1 = (now * 0.04) % 120;
        const waveShift2 = (now * 0.028) % 160;
        wavePath1.setAttribute('transform', `translate(${-waveShift1.toFixed(1)}, 0)`);
        wavePath2.setAttribute('transform', `translate(${-waveShift2.toFixed(1)}, 0)`);

        // Clouds parallax
        document.querySelectorAll('.cloud-item').forEach(cloud => {
          let x = parseFloat(cloud.getAttribute('data-x'));
          const spd = parseFloat(cloud.getAttribute('data-speed'));
          x -= (12 + effectiveSpeed * 28) * spd * dt;
          if (x < -160) x = 1020;
          cloud.setAttribute('data-x', x.toFixed(2));
          const yMatch = cloud.getAttribute('transform').match(/translate\([^,]+,\s*([^)]+)\)/);
          const yVal = yMatch ? yMatch[1] : '70';
          const scaleMatch = cloud.getAttribute('transform').match(/scale\(([^)]+)\)/);
          const scaleStr = scaleMatch ? ` scale(${scaleMatch[1]})` : '';
          cloud.setAttribute('transform', `translate(${x.toFixed(1)}, ${yVal})${scaleStr}`);
        });

        // Seagulls wing flap
        const gullFlap = Math.sin(now * 0.007) * 8;
        gull1.setAttribute('d', `M 0,0 Q 8,${(-6 + gullFlap).toFixed(1)} 16,0 Q 24,${(-6 + gullFlap).toFixed(1)} 32,0`);
        gull2.setAttribute('d', `M 0,0 Q 6,${(-5 - gullFlap * 0.8).toFixed(1)} 12,0 Q 18,${(-5 - gullFlap * 0.8).toFixed(1)} 24,0`);

        // Wind Speed Lines
        state.windParticles.forEach(p => {
          if (effectiveSpeed < 0.3) {
            p.el.setAttribute('opacity', '0');
            return;
          }
          p.el.setAttribute('opacity', Math.min(0.65, effectiveSpeed * 0.25).toFixed(2));
          p.x -= p.speed * effectiveSpeed * 120 * dt;
          if (p.x < -80) {
            p.x = 980 + Math.random() * 120;
            p.y = 100 + Math.random() * 280;
          }
          p.el.setAttribute('x1', p.x.toFixed(1));
          p.el.setAttribute('y1', p.y.toFixed(1));
          p.el.setAttribute('x2', (p.x + p.len * Math.min(1.8, effectiveSpeed)).toFixed(1));
          p.el.setAttribute('y2', p.y.toFixed(1));
        });

        // 11. Update Flying Fish Arcs toward Pelican's Open Beak Target (555, 88)
        const targetX = 555;
        const targetY = 88 + bodyBobY;
        for (let i = state.flyingFishList.length - 1; i >= 0; i--) {
          const fish = state.flyingFishList[i];
          fish.progress += dt * 1.45;
          const t = Math.min(1, fish.progress);

          const curX = fish.startX + (targetX - fish.startX) * t;
          const linearY = fish.startY + (targetY - fish.startY) * t;
          const parabola = 4 * t * (1 - t) * fish.arcHeight;
          const curY = linearY - parabola;

          // Tangent angle along arc
          const dx = targetX - fish.startX;
          const dy = (targetY - fish.startY) - 4 * (1 - 2 * t) * fish.arcHeight;
          const angle = Math.atan2(dy, dx) * 180 / Math.PI;

          fish.el.setAttribute('transform', `translate(${curX.toFixed(1)}, ${curY.toFixed(1)}) rotate(${angle.toFixed(1)})`);

          // Keep mouth open as fish approaches
          if (t > 0.5) {
            state.pouchGulpOpen = Math.max(state.pouchGulpOpen, 1.0);
          }

          if (t >= 1) {
            // Fish caught inside gular pouch!
            flyingFishLayer.removeChild(fish.el);
            state.flyingFishList.splice(i, 1);
            state.fishEaten += 1;
            fishCountReadout.textContent = state.fishEaten + ' 条';
            state.pouchBulge = 1.0;
            state.pouchGulpOpen = 0.2;
            playGulpSound();
          }
        }

        requestAnimationFrame(updateFrame);
      }

      // =========================================================================
      // 9. EVENT LISTENERS
      // =========================================================================
      playPauseBtn.addEventListener('click', () => {
        state.isPlaying = !state.isPlaying;
        if (state.isPlaying) {
          playPauseIcon.textContent = '⏸️';
          playPauseLabel.textContent = '暂停骑行';
          statusDot.className = 'w-2 h-2 rounded-full bg-emerald-500 animate-pulse';
        } else {
          playPauseIcon.textContent = '▶️';
          playPauseLabel.textContent = '继续骑行';
          statusDot.className = 'w-2 h-2 rounded-full bg-amber-500';
        }
      });

      speedSlider.addEventListener('input', (e) => {
        state.speedMultiplier = parseFloat(e.target.value);
        speedMultiplierBadge.textContent = state.speedMultiplier.toFixed(1) + 'x';
        if (!state.isPlaying) {
          playPauseBtn.click();
        }
      });

      sprintBtn.addEventListener('click', () => {
        if (!state.isPlaying) {
          playPauseBtn.click();
        }
        state.sprintBoost = 1.3;
        playBellSound();
        state.bellTimer = 0.65;
      });

      tossFishBtn.addEventListener('click', () => {
        spawnFlyingFish(890, 320 + (Math.random() * 60 - 30));
      });

      ringBellBtn.addEventListener('click', () => {
        state.bellTimer = 0.65;
        playBellSound();
      });

      toggleHatBtn.addEventListener('click', () => {
        state.hatVisible = !state.hatVisible;
        captainHatGroup.style.display = state.hatVisible ? 'block' : 'none';
        hatBtnLabel.textContent = state.hatVisible ? '船长帽: 开' : '船长帽: 关';
      });

      muteBtn.addEventListener('click', () => {
        state.soundEnabled = !state.soundEnabled;
        muteIcon.textContent = state.soundEnabled ? '🔊' : '🔇';
      });

      themeDayBtn.addEventListener('click', () => setSceneTheme('day'));
      themeSunsetBtn.addEventListener('click', () => setSceneTheme('sunset'));
      themeNightBtn.addEventListener('click', () => setSceneTheme('night'));

      // Clicking anywhere on the SVG stage tosses a fish from that point toward the pelican's mouth
      pelicanSvg.addEventListener('click', (e) => {
        const pt = pelicanSvg.createSVGPoint();
        pt.x = e.clientX;
        pt.y = e.clientY;
        const svgP = pt.matrixTransform(pelicanSvg.getScreenCTM().inverse());
        spawnFlyingFish(svgP.x, svgP.y);
      });

      // Kick off animation loop
      requestAnimationFrame(updateFrame);
    })();
  </script>
</body>
</html>
