<div class="bar"><button id="toggle" aria-label="暂停动画">Ⅱ　暂停</button><div class="track"><div class="fill" id="fill"></div></div><span id="clock">00:00 / 00:12</span><button id="speed" aria-label="切换播放速度">1×</button></div></div></main>
<script>
const el=id=>document.getElementById(id), ns='http://www.w3.org/2000/svg';
for(let i=0;i<12;i++){const line=document.createElementNS(ns,'path');line.setAttribute('d','M0 -66V66');line.setAttribute('transform','rotate('+i*15+')');el('spokes').append(line)}
let time=0,last=null,rate=1,playing=!matchMedia('(prefers-reduced-motion: reduce)').matches;
const move=(id,x,y)=>el(id).setAttribute('transform','translate('+x+' '+y+')');
function render(){
 const phase=time/12*Math.PI*2,a=phase*8, bob=Math.cos(a*2)*1.7;
 for(const id of ['rear','front'])el(id).setAttribute('transform','rotate('+time*120+')');
 move('bird',0,bob);move('road',-(time*174%87),0);move('waves',-time*9,0);move('land',-time/12*1100,0);move('sky',Math.sin(phase)*10,0);move('boat',896-12*Math.sin(phase),348+1.4*Math.sin(phase*4));
 function pose(angle){const x=549+24*Math.cos(angle),y=425+24*Math.sin(angle),hx=516,hy=298+bob;
 const dx=x-hx,dy=y-hy,d=Math.hypot(dx,dy),u=(78*78-82*82+d*d)/(2*d),v=Math.sqrt(Math.max(0,78*78-u*u));
 return {x,y,line:'M'+hx+' '+hy+'L'+(hx+(u*dx+v*dy)/d)+' '+(hy+(u*dy-v*dx)/d)+' '+x+' '+(y-4)}}
 const p=pose(a),q=pose(a+Math.PI);farPath.setAttribute('d',q.line+'l12 3');
 for(const id of ['leg','legBorder'])el(id).setAttribute('d',p.line);
 el('crank').setAttribute('d','M549 425L'+p.x+' '+p.y);el('foot').setAttribute('d','M'+(p.x-4)+' '+(p.y-6)+'q4-3 9 1l14 6q-9 3-22 0z');el('pedal').setAttribute('d','M'+(p.x-6)+' '+(p.y+4)+'h27');
 el('fill').style.transform='scaleX('+time/12+')';el('clock').textContent='00:'+String(Math.floor(time)).padStart(2,'0')+' / 00:12';
}
const farPath=document.createElementNS(ns,'path');el('farLeg').append(farPath);
function label(){el('toggle').textContent=playing?'Ⅱ　暂停':'▷　播放';el('toggle').setAttribute('aria-label',playing?'暂停动画':'播放动画')}
let frame;function loop(t){tickFrame(t);if(playing)frame=requestAnimationFrame(loop)}
function tickFrame(t){if(last!==null)time=(time+(t-last)*rate/1000)%12;last=t;render()}
el('toggle').onclick=()=>{playing=!playing;last=null;label();cancelAnimationFrame(frame);if(playing)frame=requestAnimationFrame(loop)};
el('speed').onclick=()=>{rate=rate===1?1.5:rate===1.5?0.5:1;el('speed').textContent=rate+'×'};
document.addEventListener('visibilitychange',()=>last=null);label();render();if(playing)frame=requestAnimationFrame(loop);
</script></html>
